<div class="login-page">

  <mat-card
    class="login-card"
    appearance="outlined">

    <mat-card-header>

      <mat-card-title>
        Iniciar sesión
      </mat-card-title>

      <mat-card-subtitle>
        Accede usando tu documento y contraseña.
      </mat-card-subtitle>

    </mat-card-header>

    <mat-card-content>

      @if (loading()) {

        <div class="center">
          <mat-spinner diameter="40" />
        </div>

      } @else if (empleados().length === 0) {

        <p class="hint">
          No hay empleados registrados.
          Crea el primero para comenzar.
        </p>

        <form
          [formGroup]="firstEmpleadoForm"
          (ngSubmit)="crearPrimero()"
          class="form-grid">

          <mat-form-field appearance="outline">

            <mat-label>
              Documento
            </mat-label>

            <input
              matInput
              formControlName="documento" />

          </mat-form-field>

          <mat-form-field appearance="outline">

            <mat-label>
              Nombre
            </mat-label>

            <input
              matInput
              formControlName="nombre" />

          </mat-form-field>

          <mat-form-field appearance="outline">

            <mat-label>
              Cargo
            </mat-label>

            <input
              matInput
              formControlName="cargo" />

          </mat-form-field>

          <mat-form-field appearance="outline">

            <mat-label>
              Salario
            </mat-label>

            <input
              matInput
              type="number"
              formControlName="salario" />

          </mat-form-field>

          <mat-form-field
            appearance="outline"
            class="span-2">

            <mat-label>
              Correo
            </mat-label>

            <input
              matInput
              type="email"
              formControlName="correo"
              autocomplete="email" />

          </mat-form-field>

          <mat-form-field
            appearance="outline"
            class="span-2">

            <mat-label>
              Teléfono
            </mat-label>

            <input
              matInput
              formControlName="telefono" />

          </mat-form-field>

          <mat-form-field
            appearance="outline"
            class="span-2">

            <mat-label>
              Contraseña
            </mat-label>

            <input
              matInput
              type="password"
              formControlName="contrasena"
              autocomplete="new-password" />

          </mat-form-field>

          <div class="span-2 actions">

            <button
              mat-flat-button
              color="primary"
              type="submit">

              Crear y entrar

            </button>

          </div>

        </form>

      } @else {

        <form
          [formGroup]="loginForm"
          (ngSubmit)="ingresar()"
          class="login-form">

          <mat-form-field
            appearance="outline"
            class="full">

            <mat-label>
              Documento
            </mat-label>

            <input
              matInput
              formControlName="documento"
              autocomplete="username" />

          </mat-form-field>

          <mat-form-field
            appearance="outline"
            class="full">

            <mat-label>
              Contraseña
            </mat-label>

            <input
              matInput
              type="password"
              formControlName="contrasena"
              autocomplete="current-password" />

          </mat-form-field>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            class="submit-btn">

            Ingresar

          </button>

        </form>
      }

    </mat-card-content>

  </mat-card>

</div>
