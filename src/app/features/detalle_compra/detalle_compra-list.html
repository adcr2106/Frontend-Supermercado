<div class="header-container">

  <div class="info-compra">

    <p>
      <strong>ID Compra:</strong>
      {{ compra?.id }}
    </p>

    <p>
      <strong>Cliente:</strong>
      {{ compra?.doc_cliente }}
    </p>

    <p>
      <strong>Empleado:</strong>
      {{ compra?.doc_empleado }}
    </p>

    <p>
      <strong>Total Actual:</strong>
      {{ totalCompra | currency:'COP':'symbol':'1.0-0' }}
    </p>

  </div>

  <div class="acciones">

    <button
      mat-flat-button
      color="primary"
      (click)="abrirDialog()">

      Agregar Producto

    </button>

    <button
      mat-flat-button
      color="accent"
      (click)="finalizarCompra()"
      [disabled]="detalles.length === 0">

      Finalizar Compra

    </button>

  </div>

</div>

<table
  mat-table
  [dataSource]="detalles"
  class="mat-elevation-z8">

  <!-- PRODUCTO -->
  <ng-container matColumnDef="producto">

    <th mat-header-cell *matHeaderCellDef>
      Producto
    </th>

    <td mat-cell *matCellDef="let d">
      {{ d.nombre_producto }}
    </td>

  </ng-container>

  <!-- CANTIDAD -->
  <ng-container matColumnDef="cantidad">

    <th mat-header-cell *matHeaderCellDef>
      Cantidad
    </th>

    <td mat-cell *matCellDef="let d">
      {{ d.cantidad }}
    </td>

  </ng-container>

  <!-- SUBTOTAL -->
  <ng-container matColumnDef="subtotal">

    <th mat-header-cell *matHeaderCellDef>
      Subtotal
    </th>

    <td mat-cell *matCellDef="let d">
      {{ d.subtotal | currency:'COP':'symbol':'1.0-0' }}
    </td>

  </ng-container>

  <!-- ACCIONES -->
  <ng-container matColumnDef="acciones">

    <th mat-header-cell *matHeaderCellDef>
      Acciones
    </th>

    <td mat-cell *matCellDef="let d">

      <button
        mat-button
        color="warn"
        (click)="eliminarDetalle(d.id_detalle)">

        Eliminar

      </button>

    </td>

  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns">
  </tr>

  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;">
  </tr>

</table>
