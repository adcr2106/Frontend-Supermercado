<h2 mat-dialog-title>

  {{
    data?.accion === 'activar'
      ? 'Activar Caja'
      : 'Desactivar Caja'
  }}

</h2>

<mat-dialog-content>

  <p>

    ¿Está seguro de que desea

    <strong>
      {{
        data?.accion === 'activar'
          ? 'activar'
          : 'desactivar'
      }}
    </strong>

    esta caja registradora?

  </p>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cerrar()">

    Cancelar

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="confirmar()">

    Confirmar

  </button>

</mat-dialog-actions>
