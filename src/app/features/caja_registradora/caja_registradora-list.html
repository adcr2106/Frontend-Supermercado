<div class="container">

  <div class="header">

    <h2>Cajas Registradoras</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="crearCaja()">

      Nueva Caja

    </button>

  </div>

  <table
    mat-table
    [dataSource]="cajas_registradoras"
    class="mat-elevation-z8">

    <!-- ID -->
    <ng-container matColumnDef="id">

      <th mat-header-cell *matHeaderCellDef>
        ID
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.id }}
      </td>

    </ng-container>

    <!-- Estado -->
    <ng-container matColumnDef="activo">

      <th mat-header-cell *matHeaderCellDef>
        Estado
      </th>

      <td mat-cell *matCellDef="let element">

        {{ element.activo ? 'Activo' : 'Inactivo' }}

      </td>

    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">

      <th mat-header-cell *matHeaderCellDef>
        Acciones
      </th>

      <td mat-cell *matCellDef="let element">

        <!-- Eliminar -->
        <button
          mat-icon-button
          color="warn"
          (click)="eliminarCaja(element.id)">

          <mat-icon>
            delete
          </mat-icon>

        </button>

        <!-- Activar -->
        <button
          *ngIf="!element.activo"
          mat-icon-button
          color="primary"
          (click)="activarCaja(element.id)">

          <mat-icon>
            check_circle
          </mat-icon>

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;">
    </tr>

  </table>

</div>
