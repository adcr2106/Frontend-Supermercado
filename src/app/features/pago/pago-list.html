<div class="container">

  <div class="header">

    <h2>Pagos</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="cambiarVista(false)">

      Pendientes

    </button>

    <button
      mat-raised-button
      color="accent"
      (click)="cambiarVista(true)">

      Todas

    </button>

  </div>

  <table
    mat-table
    [dataSource]="compras"
    class="mat-elevation-z8">

    <!-- ID -->
    <ng-container matColumnDef="id">

      <th mat-header-cell *matHeaderCellDef>
        ID Compra
      </th>

      <td mat-cell *matCellDef="let c">
        {{ c.id }}
      </td>

    </ng-container>

    <!-- CLIENTE -->
    <ng-container matColumnDef="cliente">

      <th mat-header-cell *matHeaderCellDef>
        Cliente
      </th>

      <td mat-cell *matCellDef="let c">
        {{ c.doc_cliente }}
      </td>

    </ng-container>

    <!-- EMPLEADO -->
    <ng-container matColumnDef="empleado">

      <th mat-header-cell *matHeaderCellDef>
        Empleado
      </th>

      <td mat-cell *matCellDef="let c">
        {{ c.doc_empleado }}
      </td>

    </ng-container>

    <!-- TOTAL -->
    <ng-container matColumnDef="total">

      <th mat-header-cell *matHeaderCellDef>
        Total
      </th>

      <td mat-cell *matCellDef="let c">
        {{ c.total | currency:'COP':'symbol':'1.0-0' }}
      </td>

    </ng-container>

    <!-- PAGADO -->
    <ng-container matColumnDef="pagado">

      <th mat-header-cell *matHeaderCellDef>
        Pagado
      </th>

      <td mat-cell *matCellDef="let c">
        {{ c.total_pagado | currency:'COP':'symbol':'1.0-0' }}
      </td>

    </ng-container>

    <!-- SALDO -->
    <ng-container matColumnDef="saldo">

      <th mat-header-cell *matHeaderCellDef>
        Saldo
      </th>

      <td mat-cell *matCellDef="let c">

        {{
          (c.total - c.total_pagado)
          | currency:'COP':'symbol':'1.0-0'
        }}

      </td>

    </ng-container>

    <!-- ACCIONES -->
    <ng-container matColumnDef="acciones">

      <th mat-header-cell *matHeaderCellDef>
        Acciones
      </th>

      <td mat-cell *matCellDef="let c">

        <button
          mat-button
          color="primary"
          (click)="abrirDialog(c)">

          Pagar

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;">
    </tr>

  </table>

</div>
