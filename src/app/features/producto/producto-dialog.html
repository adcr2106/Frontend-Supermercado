<h2 mat-dialog-title>

  {{ data ? 'Editar Producto' : 'Nuevo Producto' }}

</h2>

<mat-dialog-content>

  <form [formGroup]="form">

    <!-- Nombre -->
    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Nombre
      </mat-label>

      <input
        matInput
        formControlName="nombre"
        placeholder="Ingrese el nombre del producto" />

    </mat-form-field>

    <!-- Precio -->
    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Precio
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="precio"
        placeholder="Ingrese el precio" />

    </mat-form-field>

    <!-- Stock -->
    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Stock
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="stock"
        placeholder="Ingrese el stock" />

    </mat-form-field>

    <!-- Categoría -->
    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Categoría
      </mat-label>

      <mat-select formControlName="id_categoria">

        <mat-option
          *ngFor="let categoria of categorias"
          [value]="categoria.id_categoria">

          {{ categoria.nombre }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Proveedor -->
    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Proveedor
      </mat-label>

      <mat-select formControlName="id_proveedor">

        <mat-option
          *ngFor="let proveedor of proveedores"
          [value]="proveedor.id_proveedor">

          {{ proveedor.nombre }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancelar()">

    Cancelar

  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="guardar()">

    Guardar

  </button>

</mat-dialog-actions>
