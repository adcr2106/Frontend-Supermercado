<div class="container">

  <div class="header">

    <h2>Jornadas</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="abrirDialog()">

      Nueva Jornada

    </button>

  </div>

  <table
    mat-table
    [dataSource]="jornadas"
    class="mat-elevation-z8">

    <!-- Empleado -->
    <ng-container matColumnDef="id_empleado">

      <th mat-header-cell *matHeaderCellDef>
        Empleado
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.id_empleado }}
      </td>

    </ng-container>

    <!-- Caja -->
    <ng-container matColumnDef="id_caja">

      <th mat-header-cell *matHeaderCellDef>
        Caja
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.id_caja }}
      </td>

    </ng-container>

    <!-- Inicio -->
    <ng-container matColumnDef="inicio_jornada">

      <th mat-header-cell *matHeaderCellDef>
        Inicio
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.inicio_jornada | date:'short' }}
      </td>

    </ng-container>

    <!-- Fin -->
    <ng-container matColumnDef="fin_jornada">

      <th mat-header-cell *matHeaderCellDef>
        Fin
      </th>

      <td mat-cell *matCellDef="let element">

        {{
          element.fin_jornada
            ? (element.fin_jornada | date:'short')
            : 'Abierta'
        }}

      </td>

    </ng-container>

    <!-- Estado -->
    <ng-container matColumnDef="activo">

      <th mat-header-cell *matHeaderCellDef>
        Estado
      </th>

      <td mat-cell *matCellDef="let element">

        {{ element.activo ? 'Activo' : 'Inactivo' }}

      </td>

    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">

      <th mat-header-cell *matHeaderCellDef>
        Acciones
      </th>

      <td mat-cell *matCellDef="let element">

        <!-- Cerrar Jornada -->
        <button
          *ngIf="!element.fin_jornada"
          mat-icon-button
          color="primary"
          (click)="cerrarJornada(element.id)">

          <mat-icon>
            lock_clock
          </mat-icon>

        </button>

        <!-- Eliminar -->
        <button
          mat-icon-button
          color="warn"
          (click)="eliminarJornada(element.id)">

          <mat-icon>
            delete
          </mat-icon>

        </button>

        <!-- Activar -->
        <button
          *ngIf="!element.activo"
          mat-icon-button
          color="accent"
          (click)="activarJornada(element.id)">

          <mat-icon>
            check_circle
          </mat-icon>

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;">
    </tr>

  </table>

</div>
