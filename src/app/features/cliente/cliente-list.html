<div class="container">

  <div class="header">

    <h2>
      Clientes
    </h2>

    <button
      mat-raised-button
      color="primary"
      (click)="abrirDialog()">

      Nuevo Cliente

    </button>

  </div>

  <table
    mat-table
    [dataSource]="clientes"
    class="mat-elevation-z8">

    <!-- Documento -->
    <ng-container matColumnDef="documento">

      <th mat-header-cell *matHeaderCellDef>
        Documento
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.documento }}
      </td>

    </ng-container>

    <!-- Nombre -->
    <ng-container matColumnDef="nombre">

      <th mat-header-cell *matHeaderCellDef>
        Nombre
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.nombre }}
      </td>

    </ng-container>

    <!-- Teléfono -->
    <ng-container matColumnDef="telefono">

      <th mat-header-cell *matHeaderCellDef>
        Teléfono
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.telefono || '-' }}
      </td>

    </ng-container>

    <!-- Correo -->
    <ng-container matColumnDef="correo">

      <th mat-header-cell *matHeaderCellDef>
        Correo
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.correo || '-' }}
      </td>

    </ng-container>

    <!-- Estado -->
    <ng-container matColumnDef="activo">

      <th mat-header-cell *matHeaderCellDef>
        Estado
      </th>

      <td mat-cell *matCellDef="let element">

        {{ element.activo ? 'Activo' : 'Inactivo' }}

      </td>

    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">

      <th mat-header-cell *matHeaderCellDef>
        Acciones
      </th>

      <td mat-cell *matCellDef="let element">

        <!-- Editar -->
        <button
          mat-icon-button
          color="primary"
          (click)="abrirDialog(element)">

          <mat-icon>
            edit
          </mat-icon>

        </button>

        <!-- Eliminar -->
        <button
          mat-icon-button
          color="warn"
          (click)="eliminarCliente(element.id)">

          <mat-icon>
            delete
          </mat-icon>

        </button>

        <!-- Activar -->
        <button
          *ngIf="!element.activo"
          mat-icon-button
          color="accent"
          (click)="activarCliente(element.id)">

          <mat-icon>
            check_circle
          </mat-icon>

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;">
    </tr>

  </table>

</div>
