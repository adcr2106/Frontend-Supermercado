<div class="container">

  <div class="header">

    <h2>Empleados</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="abrirDialog()">

      Nuevo Empleado

    </button>

  </div>

  <table
    mat-table
    [dataSource]="empleados"
    class="mat-elevation-z8">

    <!-- Documento -->
    <ng-container matColumnDef="documento">

      <th mat-header-cell *matHeaderCellDef>
        Documento
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.documento }}
      </td>

    </ng-container>

    <!-- Nombre -->
    <ng-container matColumnDef="nombre">

      <th mat-header-cell *matHeaderCellDef>
        Nombre
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.nombre }}
      </td>

    </ng-container>

    <!-- Cargo -->
    <ng-container matColumnDef="cargo">

      <th mat-header-cell *matHeaderCellDef>
        Cargo
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.cargo }}
      </td>

    </ng-container>

    <!-- Salario -->
    <ng-container matColumnDef="salario">

      <th mat-header-cell *matHeaderCellDef>
        Salario
      </th>

      <td mat-cell *matCellDef="let element">
        {{ element.salario | currency }}
      </td>

    </ng-container>

    <!-- Estado -->
    <ng-container matColumnDef="activo">

      <th mat-header-cell *matHeaderCellDef>
        Estado
      </th>

      <td mat-cell *matCellDef="let element">

        {{ element.activo ? 'Activo' : 'Inactivo' }}

      </td>

    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">

      <th mat-header-cell *matHeaderCellDef>
        Acciones
      </th>

      <td mat-cell *matCellDef="let element">

        <!-- Editar -->
        <button
          mat-icon-button
          color="primary"
          (click)="abrirDialog(element)">

          <mat-icon>
            edit
          </mat-icon>

        </button>

        <!-- Eliminar -->
        <button
          mat-icon-button
          color="warn"
          (click)="eliminarEmpleado(element.id)">

          <mat-icon>
            delete
          </mat-icon>

        </button>

        <!-- Activar -->
        <button
          *ngIf="!element.activo"
          mat-icon-button
          color="accent"
          (click)="activarEmpleado(element.id)">

          <mat-icon>
            check_circle
          </mat-icon>

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;">
    </tr>

  </table>

</div>
