<h2 mat-dialog-title>

  {{ data.mode === 'create'
      ? 'Nuevo Proveedor'
      : 'Editar Proveedor' }}

</h2>

<mat-dialog-content>

  <form [formGroup]="form">

    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Nombre
      </mat-label>

      <input
        matInput
        formControlName="nombre"
        placeholder="Ingrese el nombre del proveedor" />

      <mat-error
        *ngIf="form.controls.nombre.hasError('required')">

        El nombre es obligatorio

      </mat-error>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    Cancelar

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">

    {{ data.mode === 'create'
        ? 'Crear'
        : 'Actualizar' }}

  </button>

</mat-dialog-actions>
